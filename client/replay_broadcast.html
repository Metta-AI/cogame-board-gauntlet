<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Board Gauntlet — Replay</title>
<link rel="stylesheet" href="/client/chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">GAUNT<span>LET</span></div>
      <div id="clock">PLY 0</div>
      <div id="topright">
        <span id="statuschip">replay</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<div id="loading">LOADING REPLAY…</div>
<script src="/client/chrome_common.js"></script>
<script src="/client/renderer.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  GauntletRenderer.bindFeedToggle(document.getElementById("feedtoggle"), true);
  var scheme = location.protocol === "https:" ? "wss://" : "ws://";
  var socket = new WebSocket(scheme + location.host + "/replay");
  socket.onmessage = function (frame) {
    var payload = JSON.parse(frame.data);
    if (payload.type !== "replay") return;
    document.getElementById("loading").style.display = "none";
    fit();
    GauntletRenderer.attachReplay({
      canvas: canvas,
      feed: document.getElementById("feed"),
      scrub: document.getElementById("scrub"),
      playButton: document.getElementById("play"),
      label: document.getElementById("pos"),
      clock: document.getElementById("clock"),
      scorebug: document.getElementById("scorebug"),
      endscreen: document.getElementById("endscreen"),
      assetBase: "/client/assets",
      payload: payload
    });
    socket.onmessage = null;
  };
  socket.onerror = function () {
    document.getElementById("loading").textContent = "REPLAY FAILED TO LOAD";
  };
</script>
<!-- ===================================================================
     BOARD-GAUNTLET additions to the inherited cogame-babel chrome
     Everything above this line is cogame-babel's client/replay.html copied
     byte for byte, with three changes: the <title> text, the #wordmark
     inner text, and the <script src> list, which gains
     /client/chrome_common.js ahead of /client/renderer.js. No starter
     element is removed.
     =================================================================== -->
<script>
  // The game block owns the feed lines and the endcard columns; the chrome
  // copied from cogame-babel calls into them through these two setters
  // (chrome edits 2 and 5). Registering here as well as in renderer.js
  // keeps the pod page honest if the module load order ever changes.
  GauntletChrome.setFeedText(GauntletRenderer.feedLine);
  GauntletChrome.setEndColumns(GauntletRenderer.endTable);
  GauntletChrome.relayout();
  window.addEventListener("resize", GauntletChrome.relayout);
</script>
</body>
</html>
